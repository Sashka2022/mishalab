if(q.visual==='polygon'){let pts=Array.from({length:q.n},(_,i)=>{let a=i*2*Math.PI/q.n-Math.PI/2;return `${150+85*Math.cos(a)},${105+85*Math.sin(a)}`;}).join(' ');return `<div class="visual"><svg viewBox="0 0 300 210"><polygon points="${pts}" fill="#e7e1fb" stroke="#6557c8" stroke-width="4"/></svg></div>`;}
if(q.visual==='rectangle')return `<div class="visual"><svg viewBox="0 0 300 170"><rect x="35" y="30" width="230" height="100" fill="#e4f2ec" stroke="#5c9e89" stroke-width="3"/><text x="150" y="155" text-anchor="middle" fill="#25354c">${q.w}</text><text x="18" y="88" text-anchor="middle" fill="#25354c">${q.h}</text></svg></div>`;
if(q.visual==='angle')return '<div class="visual"><svg viewBox="0 0 300 150"><path d="M230 120 L65 120 L195 35" fill="none" stroke="#6557c8" stroke-width="5"/><path d="M105 120 A40 40 0 0 0 98 98" fill="none" stroke="#e5a34c" stroke-width="3"/></svg></div>';
if(q.visual==='compose')return '<div class="visual"><svg viewBox="0 0 260 220" role="img"><rect x="35" y="15" width="190" height="190" rx="4" fill="#e7e1fb" stroke="#6557c8" stroke-width="5"/><line x1="35" y1="15" x2="225" y2="205" stroke="#e5a34c" stroke-width="4"/></svg></div>';
if(q.visual==='hidden')return '<div class="visual"><svg viewBox="0 0 300 220" role="img"><path d="M150 15 L25 200 L275 200 Z M150 15 L150 200" fill="#fff2e3" stroke="#6557c8" stroke-width="5" stroke-linejoin="round"/></svg></div>';return '';}
function render(){clearInterval(hudTimer);document.documentElement.dir=data.lang==='ru'?'ltr':'rtl';document.documentElement.lang=data.lang==='ru'?'ru':'he';document.getElementById('brand').innerHTML=bi(T.name);document.getElementById('nav').innerHTML=['he','ru','both'].map((l,i)=>`<button data-lang="${l}" class="${data.lang===l?'active':''}">${['עברית','Русский','עברית + Русский'][i]}</button>`).join('')+btn('home',T.home)+btn('teacher',T.teacher);document.getElementById('hud').innerHTML=`<div class="hud-pill">⚗️ <strong>${data.xp||0} XP</strong> · ${bi(P(`דרגת חוקר ${rank()}`,`Ранг исследователя ${rank()}`))}</div>${screen==='task'||screen==='end'?`<div class="hud-pill">🔥 <strong>${data.currentStreak||0}</strong> ${bi(P('רצף','серия'))}</div><button class="clock-toggle" data-action="toggle-clock" aria-label="${esc(text(P('הצגה או הסתרה של השעון','Показать или скрыть часы')))}">⏱ <span id="runClock">${data.showClock===false?'••:••':'00:00'}</span></button>`:''}`;document.getElementById('footer').innerHTML=bi(storageOK?T.note:T.saveError);const app=document.getElementById('app');
if(screen==='home')app.innerHTML=`<section class="hero"><div class="robot" aria-hidden="true">🤖</div><div class="eyebrow">${bi(P('מרכז המשימות של מישה','Центр заданий Миши'))}</div><h1>${bi(T.welcome)}</h1><div class="robot-bubble">${bi(P('כל תשובה פותחת דלת לתגלית הבאה. מוכן למסע?','Каждый ответ открывает дверь к следующему открытию. Готов к путешествию?'))}</div><p>${bi(T.intro)}</p><div class="game-stats"><div class="game-stat"><strong>${data.xp||0}</strong>${bi(P('נקודות חקר','Очки исследования'))}</div><div class="game-stat"><strong>${data.bestStreak||0}</strong>${bi(P('שיא רצף','Лучшая серия'))}</div><div class="game-stat"><strong>${data.rounds.length}</strong>${bi(P('משימות מעבדה','Лабораторные миссии'))}</div></div>${badgeHTML()}</section>${session&&session.results.length<5?`<div class="panel">${btn('resume',T.resume,'primary')} <small>${bi(T.exit)}</small></div>`:''}<button class="primary daily" data-action="daily"><div><b>${bi(P('לצאת למסע גילויים רציף','Начать непрерывное путешествие открытий'))}</b><div class="sub">${bi(P('האתגר עולה איתך · השעון רק סופר את זמן החקר','Сложность растёт вместе с тобой · часы только считают время исследования'))}</div></div><span aria-hidden="true">🚀</span></button><div class="cards">${Object.entries(domains).map(([d,v])=>`<button class="card" data-track="${d}"><span class="icon">${v.icon}</span><b>${bi(v.title)}</b><p>${bi(v.desc)}</p><small>${bi(P(`תחנת רמה ${data.levels[d]} · יוצאים לדרך ←`,`Станция уровня ${data.levels[d]} · В путь →`))}</small></button>`).join('')}</div>`;
if(screen==='task'){let q=session.task,i=q.finished?session.results.length-1:session.results.length,earned=q.finished?session.results.at(-1)?.xp||0:0;app.innerHTML=`<div class="quest-head"><div><span class="badge">${domains[q.domain].icon} ${bi(domains[q.domain].title)}</span><span class="meta journey-count">${bi(P(`מסע: ${session.runTasks||0} תגליות · רמה ${q.level}`,`Путешествие: ${session.runTasks||0} открытий · уровень ${q.level}`))}</span></div><span class="combo">🔥 ${data.currentStreak||0} ${bi(P('רצף','серия'))}</span></div><div class="mission-rail">${Array.from({length:5},(_,j)=>`<div class="mission-node ${j<i?'done':j===i?'current':''}"><span>${bi(stages[j])}</span></div>`).join('')}</div><section class="panel task-shell"><div class="eyebrow">${bi(P(`תחנה ${i+1}: ${stages[i].he}`,`Станция ${i+1}: ${stages[i].ru}`))}</div><h2>${bi(q.prompt)}</h2>${q.display?`<div class="math" dir="ltr">${esc(q.display)}</div>`:''}${renderVisual(q)}${q.mode==='number'?`<input id="answer" class="answer" inputmode="decimal" autocomplete="off" aria-label="${esc(text(T.answer))}" placeholder="?" value="${esc(q.input)}" ${q.finished?'disabled':''}>`:q.mode==='open'?`<p>${bi(T.self)}</p><textarea id="answer" class="answer" aria-label="${esc(text(T.answer))}" ${q.finished?'disabled':''}>${esc(q.input)}</textarea>`:q.mode==='options'?`<div class="options">${q.options.map((o,j)=>`<button data-option="${j}" class="${q.selected===j?'selected':''}" ${q.finished?'disabled':''}>${bi(o)}</button>`).join('')}</div>`:''}${feedback?`<div role="status" class="feedback ${feedback==='success'?'success':''}">${bi(feedback==='success'?T.success:feedback==='open'?T.self:feedback==='skip'?T.skipped:T[feedback])}${earned?`<div class="xp-pop">+${earned} XP ✦</div>`:''}${['success','open','skip'].includes(feedback)?`<p>${bi(q.hints[2])}</p>`:''}</div>`:''}${newBadge?`<div class="level-up"><b>${badgeDefs[newBadge].icon} ${bi(P('תג חדש נפתח!','Открыт новый значок!'))}</b>${bi(badgeDefs[newBadge].name)}</div>`:''}${q.hint?`<div class="hint">${q.hints.slice(0,q.hint).map((h,j)=>`<p><b>${bi(P(`רמז ${j+1}`,`Подсказка ${j+1}`))}</b>${bi(h)}</p>`).join('')}</div>`:''}<div class="actions">${q.finished?btn('next',P('אל התגלית הבאה','К следующему открытию'),'primary'):btn('check',q.mode==='open'?T.open:T.check,'primary')+`<button data-action="hint" ${q.hint===3?'disabled':''}>${bi(T.hint)} (${q.hint}/3)</button>`+btn('skip',T.skip)}</div>${q.finished&&(i===1||i===4)?`<div class="panel"><b>${bi(T.feel)}</b><div class="options">${['easy','right','hard'].map(f=>`<button data-feel="${f}" class="${session.results.at(-1).feeling===f?'selected':''}">${bi(T[f])}</button>`).join('')}</div></div>`:''}</section>${(session.runTasks||0)>0&&(session.runTasks||0)%20===0?`<p class="break-note">${bi(P('כבר עשרים תגליות במסע הזה. אפשר להמשיך, ואפשר גם למתוח ידיים ולנוח לרגע.','Уже двадцать открытий в этом путешествии. Можно продолжить или ненадолго размяться.'))}</p>`:''}`;}
if(screen==='end'){let rs=session.results,round=currentRound(),score=round?.score??roundScore(rs),researchCount=rs.filter(r=>r.open&&!r.skipped).length,changes=round?.levelChanges||{};app.innerHTML=`<section class="hero"><div class="robot">✧</div><div class="eyebrow">${bi(P('מצב רציף · גרסה 2','Непрерывный режим · версия 2'))}</div><h1>${bi(T.end)}</h1><p>${bi(P('הציון ושינוי הרמה מוצגים לרגע. האתגר הבא יתחיל אוטומטית בעוד שלוש שניות.','Результат и изменение уровня показаны на мгновение. Следующее задание начнётся автоматически через три секунды.'))}</p><div class="stat" style="text-align:center;margin:24px 0"><strong style="font-size:54px" dir="ltr">${score}/100</strong>${bi(T.score)}<div class="sub">${bi(T.scoreNote)}</div></div><div class="stats">${[['solved',rs.filter(r=>r.correct).length],['reviewed',researchCount],['skipped',rs.filter(r=>r.skipped).length]].map(([k,v])=>`<div class="stat"><strong>${v}</strong>${bi(T[k])}</div>`).join('')}</div>${researchCount?`<div class="hint">${bi(T.researchInfo)}</div>`:''}<div class="panel"><h2>${bi(P('האתגר עולה אוטומטית','Сложность растёт автоматически'))}</h2><p>${bi(P('המערכת העלתה את הרמה ככל שהביצועים העצמאיים אפשרו. הצלחה מלאה בסבב יכולה להעלות עד שתי רמות.','Система повысила уровень настолько, насколько позволила самостоятельная работа. Идеальный результат может поднять уровень сразу на две ступени.'))}</p>${Object.entries(changes).map(([d,c])=>`<div class="row"><span>${bi(domains[d].title)}</span><b dir="ltr">${c.before} → ${c.after}</b></div>`).join('')}<div class="actions">${btn('next-round',P('להתחיל עכשיו','Начать сейчас'),'primary')}</div></div><div class="actions">${round?.handRaisedAt?`<button disabled>${bi(T.handRaised)}</button>`:btn('raise-hand',T.raiseHand)}${btn('home',T.home)}</div></section>`;scheduleNextRound(round?.track);}
if(screen==='teacher'){renderTeacher(app);renderTeacherExtras(app);renderResetPanel(app);}startHudClock();
}
function renderTeacher(app){let h=data.history,closed=h.filter(r=>!r.open),solved=closed.filter(r=>r.correct),waiting=data.rounds.map((r,i)=>({r,i})).filter(x=>x.r.handRaisedAt&&!x.r.handAcknowledgedAt);app.innerHTML=`<h1>${bi(T.teacher)}</h1><p>${bi(T.note)}</p>${waiting.map(({r,i})=>`<div class="feedback success" role="alert"><div class="row"><div><b>${bi(T.finishedAlert)}</b><div class="sub">${esc(new Date(r.handRaisedAt).toLocaleString(data.lang==='ru'?'ru-RU':'he-IL'))} · <span dir="ltr">${r.score??roundScore(r.results)}/100</span></div></div><button data-ack="${i}">${bi(T.acknowledge)}</button></div></div>`).join('')}<div class="stats">${[[data.rounds.length,T.rounds],[closed.length?Math.round(solved.length/closed.length*100)+'%':'—',T.rate],[solved.length?median(solved.map(r=>r.seconds)):'—',T.median]].map(([v,t])=>`<div class="stat"><strong>${v}</strong>${bi(t)}</div>`).join('')}</div><section class="panel"><p>${bi(T.automaticLevels)}</p>${Object.entries(domains).map(([d,v])=>`<div class="row" style="margin-bottom:18px"><span>${bi(v.title)}</span><b>${bi(P(`רמה ${data.levels[d]}`,`Уровень ${data.levels[d]}`))}</b></div>`).join('')}<p>${bi(P(`משימות שבהן נעשה שימוש ברמזים: ${h.filter(r=>r.hints).length} מתוך ${h.length}.`,`Задач с подсказками: ${h.filter(r=>r.hints).length} из ${h.length}.`))}</p><h2>${bi(T.skills)}</h2>${Object.keys(data.mastery).length?Object.entries(data.mastery).map(([k,m])=>{let [d,t]=k.split(':');return `<p>${bi(domains[d].title)} · ${bi(types[t]||P(t,t))} <b dir="ltr">${m.solved}/${m.attempted}</b> ${bi(P(m.attempted>=3&&m.solved/m.attempted>=.8?'שליטה יציבה':'ממשיכים לחקור',m.attempted>=3&&m.solved/m.attempted>=.8?'Устойчивый результат':'Продолжаем исследовать'))}</p>`;}).join(''):`<p class="empty">${bi(T.none)}</p>`}</section><details class="panel"><summary>${bi(T.history)}</summary><div class="tablewrap"><table><thead><tr>${[P('תאריך','Дата'),P('נושא','Тема'),T.level,P('תוצאה','Результат'),T.hints,T.feel].map(p=>`<th>${bi(p)}</th>`).join('')}</tr></thead><tbody>${h.slice().reverse().slice(0,100).map(r=>`<tr><td>${esc(new Date(r.at).toLocaleDateString(data.lang==='ru'?'ru-RU':'he-IL'))}</td><td>${bi(domains[r.domain].title)}${bi(types[r.type]||T.research)}</td><td dir="ltr">${r.level} (${r.before} → ${r.after})</td><td>${bi(r.skipped?T.skipped:r.open?T.reviewed:r.correct?T.solved:P('טרם נפתרה','Пока не решена'))}<br>${bi(P(`${r.seconds} שניות`,`${r.seconds} с`))}</td><td>${r.hints}</td><td>${r.feeling?bi(T[r.feeling]):'—'}</td></tr>`).join('')}</tbody></table></div></details><div class="actions">${btn('export',T.export,'primary')}${btn('reset',T.reset)}</div>`;}
function renderTeacherExtras(app){let panel=app.querySelector('.panel'),scores=data.rounds.slice(-8),challenging=Object.entries(data.mastery).filter(([,m])=>m.attempted>=2&&m.solved/m.attempted<.6),mastered=Object.entries(data.mastery).filter(([,m])=>m.attempted>=3&&m.solved/m.attempted>=.8);if(panel?.querySelector('p'))panel.querySelector('p').innerHTML=bi(P('הרמות נקבעות אוטומטית לפי הצלחה, ניסיונות ורמזים. המורה צופה בהתקדמות אך אינה קובעת את הרמה.','Уровни определяются автоматически по правильным ответам, попыткам и подсказкам. Учитель наблюдает за прогрессом, но не задаёт уровень.'));let label=k=>{let [d,t]=k.split(':');return `${text(domains[d].title)} — ${text(types[t]||P(t,t))}`;};let html=`<section class="panel"><h2>${bi(P('מגמת הסבבים','Динамика занятий'))}</h2>${scores.length?`<div style="display:flex;align-items:end;gap:10px;height:150px;direction:ltr">${scores.map((r,i)=>{let score=r.score??roundScore(r.results);return `<div style="flex:1;text-align:center"><div title="${score}/100" style="height:${Math.max(8,score)}px;background:#6557c8;border-radius:8px 8px 2px 2px"></div><small>${score}</small></div>`;}).join('')}</div>`:`<p class="empty">${bi(T.none)}</p>`}<div class="stats" style="margin-top:20px"><div class="stat"><strong>${mastered.length}</strong>${bi(P('סוגי משימות בשליטה','Освоенные типы задач'))}</div><div class="stat"><strong>${challenging.length}</strong>${bi(P('סוגים שעדיין מאתגרים','Типы, которые ещё трудны'))}</div><div class="stat"><strong>${data.history.filter(r=>r.feeling==='easy').length}</strong>${bi(P('דיווחים: קל מדי','Ответов: слишком легко'))}</div></div>${challenging.length?`<h3>${bi(P('כדאי להמשיך לתרגל','Стоит продолжить тренироваться'))}</h3><ul>${challenging.slice(0,6).map(([k])=>`<li>${esc(label(k))}</li>`).join('')}</ul>`:''}</section>`;app.querySelector('.stats')?.insertAdjacentHTML('afterend',html);}
function renderResetPanel(app){let html=`<section class="panel" style="border-color:#f0c7c7;background:#fffafa"><div class="row"><div><h2 style="margin:0 0 8px">${bi(P('התחלה חדשה','Начать заново'))}</h2><p style="margin:0">${bi(P('איפוס מוחק את הרמות, הציונים, ה־XP, התגים והיסטוריית התרגול במכשיר הזה. השפה והעדפת השעון יישמרו.','Сброс удалит уровни, результаты, XP, значки и историю занятий на этом устройстве. Язык и настройка часов сохранятся.'))}</p></div><button data-action="reset" style="background:#a93f4b;color:#fff">${bi(T.reset)}</button></div></section>`;app.querySelector('h1')?.insertAdjacentHTML('afterend',html);}
function pause(){if(session?.task?.started){session.task.elapsed+=Date.now()-session.task.started;session.task.started=null;saveProgress();}}
function resume(){if(session){session.runStartedAt=session.runStartedAt||Date.parse(session.started)||Date.now();session.runTasks=session.runTasks||session.results.length;if(!session.task.finished)session.task.started=Date.now();}screen='task';feedback=session.task.finished?(session.results.at(-1).skipped?'skip':session.task.mode==='open'?'open':'success'):null;render();}
document.addEventListener('input',e=>{if(e.target.id==='answer'){session.task.input=e.target.value;saveProgress();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'&&session.task.mode!=='open'){e.preventDefault();check();}if((e.key==='Enter'||e.key===' ')&&e.target.dataset.match!=null){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-match]');if(!b||b.disabled)return;let ds=b.dataset;if(ds.lang){data.lang=ds.lang;saveProgress();render();return;}if(ds.track){startRound(ds.track);return;}if(ds.ack!=null){let round=data.rounds[Number(ds.ack)];if(round){round.handAcknowledgedAt=new Date().toISOString();saveProgress();render();}return;}let q=session?.task;if(ds.square!=null&&!q.finished){q.selected=Number(ds.square);saveProgress();render();return;}if(ds.option!=null&&!q.finished){q.selected=Number(ds.option);saveProgress();render();return;}if(ds.cell!=null&&!q.finished){let n=Number(ds.cell);q.selected=q.selected.includes(n)?q.selected.filter(x=>x!==n):[...q.selected,n];saveProgress();render();return;}if(ds.match!=null&&!q.finished){let n=Number(ds.match);if(q.moves)return;if(q.board[n])q.source=q.source===n?null:n;else if(q.source!=null){q.board[q.source]=0;q.board[n]=1;q.moves=1;q.source=null;}saveProgress();render();return;}if(ds.feel){let r=session.results.at(-1);if(!r.feeling&&ds.feel==='easy'&&r.correct&&!r.hints&&r.attempts===1){let m=data.mastery[r.domain+':'+r.type];if(m&&m.streak>=2){data.levels[r.domain]=Math.min(10,data.levels[r.domain]+1);m.streak=0;r.after=data.levels[r.domain];}}r.feeling=ds.feel;saveProgress();render();return;}
switch(ds.action){case'home':pause();screen='home';feedback=null;render();break;case'teacher':pause();screen='teacher';render();break;case'daily':startRound('daily');break;case'resume':resume();break;case'toggle-clock':data.showClock=data.showClock===false;saveProgress();updateHud();break;case'check':check();break;case'hint':q.hint=Math.min(3,q.hint+1);saveProgress();render();break;case'skip':finishTask(false,true);render();break;case'next':next();break;case'next-round':{let round=currentRound();startRound(round?.track||'daily',true);break;}case'raise-hand':{let round=currentRound();if(round&&!round.handRaisedAt){round.handRaisedAt=new Date().toISOString();saveProgress();render();}break;}case'undo':q.board=[...q.initial];q.moves=0;q.source=null;feedback=null;saveProgress();render();break;case'export':{pause();let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='misha-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}case'reset':if(confirm(text(T.confirm))){let lang=data.lang,showClock=data.showClock;clearTimeout(autoNextTimer);clearInterval(hudTimer);data=fresh();data.lang=lang;data.showClock=showClock;session=null;feedback=null;saveProgress();render();}break;}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();if(session?.runStartedAt)session.runPauseStarted=Date.now();}else if(session){if(session.runPauseStarted){session.runStartedAt+=Date.now()-session.runPauseStarted;session.runPauseStarted=null;saveProgress();}if(screen==='task'&&!session.task.finished)session.task.started=Date.now();}});window.addEventListener('pagehide',pause);
if(session?.task)session.task.started=null;
window.MishaLab={generateQuestion,checkAnswer,adaptDifficulty,applyRoundProgress,roundScore,SEG,attacks,getData:()=>data};
render();
</script></body></html>
