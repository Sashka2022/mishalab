if(screen==='end'){let rs=session.results,round=currentRound(),score=round?.score??roundScore(rs),researchCount=rs.filter(r=>r.open&&!r.skipped).length,changes=round?.levelChanges||{};app.innerHTML=`<section class="hero"><img src="assets/characters/mishi-success.svg" alt="${esc(text(P('מישי חוגג את השלמת המסע','Миша празднует завершение путешествия')))}" style="float:inline-end;width:min(220px,38vw);margin:0 18px 16px"><div class="eyebrow">${ui(P('סיכום הסשן','Итоги занятия'))}</div><h1>${ui(T.end)}</h1>${session.track==='puzzles'?puzzleAutoControl():''}<p>${ui(P(session.track==='puzzles'&&data.puzzleAuto===false?'הסבב הושלם. אפשר להתחיל סבב חדש כשתרצה.':'הסבב הושלם. אפשר לעיין בחוזקות ובתרגילים, ואז לבחור איך להמשיך.',session.track==='puzzles'&&data.puzzleAuto===false?'Занятие завершено. Начни новое, когда захочешь.':'Занятие завершено. Посмотри свои успехи и задания, а затем выбери, как продолжить.'))}</p><div class="stat" style="text-align:center;margin:24px 0"><strong style="font-size:54px" dir="ltr">${score}/100</strong>${ui(T.score)}<div class="sub">${ui(T.scoreNote)}</div></div><div class="stats">${[['solved',rs.filter(r=>r.correct).length],['skipped',rs.filter(r=>r.skipped).length]].map(([k,v])=>`<div class="stat"><strong>${v}</strong>${ui(T[k])}</div>`).join('')}</div>${researchCount?`<div class="hint">${ui(T.researchInfo)}</div>`:''}<div class="panel"><h2>${ui(P('האתגר עולה אוטומטית','Сложность растёт автоматически'))}</h2><p>${ui(P('המערכת העלתה את הרמה ככל שהביצועים העצמאיים אפשרו. הצלחה מלאה בסבב יכולה להעלות עד שתי רמות.','Система повысила уровень настолько, насколько позволила самостоятельная работа. Идеальный результат может поднять уровень сразу на две ступени.'))}</p>${Object.entries(changes).map(([d,c])=>`<div class="row"><span>${ui(domains[d].title)}</span><b dir="ltr">${c.before} → ${c.after}</b></div>`).join('')}<div class="actions">${btn('next-round',P('להתחיל עכשיו','Начать сейчас'),'primary')}</div></div><div class="actions">${round?.handRaisedAt?`<button disabled>${ui(T.handRaised)}</button>`:btn('raise-hand',T.raiseHand)}${btn('home',T.home)}</div></section>`;if(session.track!=='puzzles'||data.puzzleAuto!==false)scheduleNextRound(round?.track);}
if(screen==='end'){app.querySelector('.hero .actions')?.insertAdjacentHTML('afterbegin',SessionReview.jumpButton());app.insertAdjacentHTML('beforeend',SessionReview.render(session.results,domains[session.track]?.title));}
if(screen==='teacher'){renderTeacher(app);renderTeacherExtras(app);renderResetPanel(app);app.insertAdjacentHTML('beforeend',LearningUI.teacherPanel()+SessionReview.home()+(window.ReadingSupport?ReadingSupport.teacherPanel():'')+(window.Rewards?Rewards.renderBadges(data)+Rewards.renderAlbum(data):''));}window.ReadingSupport?.afterRender();startHudClock();narrateCurrent();fitTaskViewport();schedulePuzzleRenewal();revealPuzzleFeedback();LearningUI.afterRender();AtlasQuiz.afterRender();window.ExerciseExperience?.afterRender();window.RewardUI?.afterRender();
}
function renderTeacher(app){let h=data.history,closed=h.filter(r=>!r.open),solved=closed.filter(r=>r.correct),waiting=data.rounds.map((r,i)=>({r,i})).filter(x=>x.r.handRaisedAt&&!x.r.handAcknowledgedAt);app.innerHTML=`<h1>${ui(T.teacher)}</h1><p>${ui(T.note)}</p>${waiting.map(({r,i})=>`<div class="feedback success" role="alert"><div class="row"><div><b>${ui(T.finishedAlert)}</b><div class="sub">${esc(new Date(r.handRaisedAt).toLocaleString(data.lang==='ru'?'ru-RU':'he-IL'))} · <span dir="ltr">${r.score??roundScore(r.results)}/100</span></div></div><button data-ack="${i}">${ui(T.acknowledge)}</button></div></div>`).join('')}<div class="stats">${[[data.rounds.length,T.rounds],[closed.length?Math.round(solved.length/closed.length*100)+'%':'—',T.rate],[solved.length?median(solved.map(r=>r.seconds)):'—',T.median]].map(([v,t])=>`<div class="stat"><strong>${v}</strong>${ui(t)}</div>`).join('')}</div><section class="panel"><p>${ui(T.automaticLevels)}</p>${Object.entries(domains).map(([d,v])=>`<div class="row" style="margin-bottom:18px"><span>${ui(v.title)}</span><b>${ui(P(`רמה ${data.levels[d]}`,`Уровень ${data.levels[d]}`))}</b></div>`).join('')}<p>${ui(P(`משימות שבהן נעשה שימוש ברמזים: ${h.filter(r=>r.hints).length} מתוך ${h.length}.`,`Задач с подсказками: ${h.filter(r=>r.hints).length} из ${h.length}.`))}</p><h2>${ui(T.skills)}</h2>${Object.keys(data.mastery).length?Object.entries(data.mastery).map(([k,m])=>{let [d,t]=k.split(':');return `<p>${ui(domains[d].title)} · ${ui(types[t]||P(t,t))} <b dir="ltr">${m.solved}/${m.attempted}</b> ${ui(P(m.attempted>=3&&m.solved/m.attempted>=.8?'שליטה יציבה':'ממשיכים לחקור',m.attempted>=3&&m.solved/m.attempted>=.8?'Устойчивый результат':'Продолжаем исследовать'))}</p>`;}).join(''):`<p class="empty">${ui(T.none)}</p>`}</section><details class="panel"><summary>${ui(T.history)}</summary><div class="tablewrap"><table><thead><tr>${[P('תאריך','Дата'),P('נושא','Тема'),T.level,P('תוצאה','Результат'),T.hints,T.feel].map(p=>`<th>${ui(p)}</th>`).join('')}</tr></thead><tbody>${h.slice().reverse().slice(0,100).map(r=>`<tr><td>${esc(new Date(r.at).toLocaleDateString(data.lang==='ru'?'ru-RU':'he-IL'))}</td><td>${ui(domains[r.domain].title)}${ui(types[r.type]||T.research)}</td><td dir="ltr">${r.level} (${r.before} → ${r.after})</td><td>${ui(r.skipped?T.skipped:r.open?T.reviewed:r.correct?T.solved:P('טרם נפתרה','Пока не решена'))}<br>${ui(P(`${r.seconds} שניות`,`${r.seconds} с`))}</td><td>${r.hints}</td><td>${r.feeling?ui(T[r.feeling]):'—'}</td></tr>`).join('')}</tbody></table></div></details><div class="actions">${btn('export',T.export,'primary')}${btn('reset',T.reset)}</div>`;}
function renderTeacherExtras(app){let panel=app.querySelector('.panel'),scores=data.rounds.slice(-8),challenging=Object.entries(data.mastery).filter(([,m])=>m.attempted>=2&&m.solved/m.attempted<.6),mastered=Object.entries(data.mastery).filter(([,m])=>m.attempted>=3&&m.solved/m.attempted>=.8);if(panel?.querySelector('p'))panel.querySelector('p').innerHTML=ui(P('רמת הפתיחה נבחרת במסך הבית. בהמשך הרמות מותאמות לפי הצלחה, ניסיונות ורמזים. באזור הזה צופים בהתקדמות.','Начальный уровень выбирается на главном экране. Дальше он зависит от успехов, попыток и подсказок. Здесь можно следить за прогрессом.'));let label=k=>{let [d,t]=k.split(':');return `${text(domains[d].title)} — ${text(types[t]||P(t,t))}`;};let html=`<section class="panel"><h2>${ui(P('מגמת הסבבים','Динамика занятий'))}</h2>${scores.length?`<div style="display:flex;align-items:end;gap:10px;height:150px;direction:ltr">${scores.map((r,i)=>{let score=r.score??roundScore(r.results);return `<div style="flex:1;text-align:center"><div title="${score}/100" style="height:${Math.max(8,score)}px;background:#6557c8;border-radius:8px 8px 2px 2px"></div><small>${score}</small></div>`;}).join('')}</div>`:`<p class="empty">${ui(T.none)}</p>`}<div class="stats" style="margin-top:20px"><div class="stat"><strong>${mastered.length}</strong>${ui(P('סוגי משימות בשליטה','Освоенные типы задач'))}</div><div class="stat"><strong>${challenging.length}</strong>${ui(P('סוגים שעדיין מאתגרים','Типы, которые ещё трудны'))}</div><div class="stat"><strong>${data.history.filter(r=>r.feeling==='easy').length}</strong>${ui(P('דיווחים: קל מדי','Ответов: слишком легко'))}</div></div>${challenging.length?`<h3>${ui(P('כדאי להמשיך לתרגל','Стоит продолжить тренироваться'))}</h3><ul>${challenging.slice(0,6).map(([k])=>`<li>${esc(label(k))}</li>`).join('')}</ul>`:''}</section>`;app.querySelector('.stats')?.insertAdjacentHTML('afterend',html);}
function renderResetPanel(app){let html=`<section class="panel" style="border-color:#f0c7c7;background:#fffafa"><div class="row"><div><h2 style="margin:0 0 8px">${ui(P('התחלה חדשה','Начать заново'))}</h2><p style="margin:0">${ui(P('איפוס מוחק את הרמות, הציונים, ה־XP, התגים והיסטוריית התרגול במכשיר הזה. השפה והעדפת השעון יישמרו.','Сброс удалит уровни, результаты, XP, значки и историю занятий на этом устройстве. Язык и настройка часов сохранятся.'))}</p></div><button data-action="reset" style="background:#a93f4b;color:#fff">${ui(T.reset)}</button></div></section>`;app.querySelector('h1')?.insertAdjacentHTML('afterend',html);}
function pause(){if(session?.task?.started){session.task.elapsed+=Date.now()-session.task.started;session.task.started=null;saveProgress();}}
function resume(){if(!session)return;if(session.results.length===5&&currentRound()?.completed){screen='end';render();return;}if(session){session.runStartedAt=session.runStartedAt||Date.parse(session.started)||Date.now();session.runTasks=session.runTasks||session.results.length;if(!session.task.finished)session.task.started=Date.now();}screen='task';feedback=session.task.finished?(session.results.at(-1).skipped?'skip':session.task.mode==='open'?'open':'success'):null;render();}
document.addEventListener('input',e=>{if(e.target.id==='difficulty-range'){chooseStartingDifficulty(e.target.value,false);return;}if(e.target.id==='answer'){session.task.input=e.target.value;saveProgress();let checkButton=document.querySelector('[data-action="check"]');if(checkButton)checkButton.disabled=!e.target.value.trim();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'&&session.task.mode!=='open'){e.preventDefault();check();}if((e.key==='Enter'||e.key===' ')&&e.target.dataset.match!=null){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('click',e=>{if(e.target.closest('[data-break-action="open"]')){BreakGame.open();return;}if(PlaySession.handleClick(e)||AtlasQuiz.handleClick(e)||LearningUI.handleClick(e))return;let b=e.target.closest('button,[data-match]');if(!b||b.disabled)return;let ds=b.dataset;if(ds.difficulty!=null){chooseStartingDifficulty(ds.difficulty);return;}if(ds.puzzleKind){if(ds.puzzleKind==='mixed'||PuzzleGames.kinds.includes(ds.puzzleKind))startRound('puzzles',false,ds.puzzleKind);return;}if(ds.puzzleAction){let q=session?.task;if((screen==='task'||PlaySession.isCore())&&q?.mode==='puzzle'&&PuzzleGames.act(q,ds.puzzleAction,ds.puzzleValue)){let scrollTop=document.querySelector('.task-shell')?.scrollTop||0;feedback=null;saveProgress();render();document.querySelector('.task-shell').scrollTop=scrollTop;let target=ds.puzzleAction==='digit'?document.querySelector(`[data-puzzle-action="digit"][data-puzzle-value="${ds.puzzleValue}"]`):document.querySelector(`[data-puzzle-action="${ds.puzzleAction}"]${ds.puzzleValue!=null?`[data-puzzle-value="${ds.puzzleValue}"]`:''}`);target?.focus({preventScroll:true});}return;}if(ds.lang){data.lang=ds.lang;narratedTarget=null;narratedState='';window.speechSynthesis?.cancel();saveProgress();render();return;}if(ds.track){startRound(ds.track);return;}if(ds.ack!=null){let round=data.rounds[Number(ds.ack)];if(round){round.handAcknowledgedAt=new Date().toISOString();saveProgress();render();}return;}let q=session?.task;if(ds.square!=null&&!q.finished){q.selected=Number(ds.square);saveProgress();render();return;}if(ds.option!=null&&!q.finished){q.selected=Number(ds.option);saveProgress();render();return;}if(ds.cell!=null&&!q.finished){let n=Number(ds.cell);q.selected=q.selected.includes(n)?q.selected.filter(x=>x!==n):[...q.selected,n];saveProgress();render();return;}if(ds.match!=null&&!q.finished){let n=Number(ds.match);if(q.moves)return;if(q.board[n])q.source=q.source===n?null:n;else if(q.source!=null){q.board[q.source]=0;q.board[n]=1;q.moves=1;q.source=null;}saveProgress();render();return;}if(ds.feel){let r=session.results.at(-1);if(!r.feeling&&ds.feel==='easy'&&r.correct&&!r.hints&&r.attempts===1){let m=data.mastery[r.domain+':'+r.type];if(m&&m.streak>=2){data.levels[r.domain]=Math.min(10,data.levels[r.domain]+1);m.streak=0;r.after=data.levels[r.domain];}}r.feeling=ds.feel;saveProgress();render();return;}
switch(ds.action){case'puzzle-auto':data.puzzleAuto=data.puzzleAuto===false;saveProgress();render();document.querySelector('[data-action="puzzle-auto"]')?.focus({preventScroll:true});break;case'home':pause();screen='home';feedback=null;render();break;case'teacher':pause();screen='teacher';render();break;case'daily':startRound('daily');break;case'resume':resume();break;case'toggle-sound':data.sound=data.sound===false;saveProgress();render();break;case'toggle-clock':data.showClock=data.showClock===false;saveProgress();updateHud();break;case'toggle-speech':data.readAloud=!data.readAloud;narratedTarget=null;narratedState='';if(!data.readAloud)window.speechSynthesis.cancel();saveProgress();render();break;case'check':check();break;case'hint':window.ExerciseExperience?.onHint();q.hint=Math.min(3,q.hint+1);saveProgress();render();break;case'skip':finishTask(false,true);render();break;case'next':next();break;case'next-round':{let round=currentRound();startRound(round?.track||'daily',true);break;}case'raise-hand':{let round=currentRound();if(round&&!round.handRaisedAt){round.handRaisedAt=new Date().toISOString();saveProgress();render();}break;}case'undo':q.board=[...q.initial];q.moves=0;q.source=null;feedback=null;saveProgress();render();break;case'export':{pause();let blob=new Blob([JSON.stringify({...data,curiosityAtlas:AtlasQuiz.state()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='misha-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}case'reset':if(confirm(text(T.confirm))){let lang=data.lang,showClock=data.showClock,readAloud=data.readAloud;clearTimeout(autoNextTimer);clearInterval(hudTimer);window.speechSynthesis?.cancel();data=fresh();AtlasQuiz.reset();data.lang=lang;data.showClock=showClock;data.readAloud=readAloud;session=null;feedback=null;narratedTarget=null;narratedState='';saveProgress();render();}break;}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(autoNextTimer);pause();window.speechSynthesis?.cancel();if(session?.runStartedAt)session.runPauseStarted=Date.now();}else if(session){if(session.runPauseStarted){session.runStartedAt+=Date.now()-session.runPauseStarted;session.runPauseStarted=null;saveProgress();}if((screen==='task'||PlaySession.isCore())&&!session.task.finished)session.task.started=Date.now();schedulePuzzleRenewal();if(screen==='end'&&(session.track!=='puzzles'||data.puzzleAuto!==false))scheduleNextRound(session.track);}});window.addEventListener('pagehide',()=>{pause();window.speechSynthesis?.cancel();});
window.addEventListener('resize',()=>{if(screen==='task')fitTaskViewport();});
if(session?.task?.type==='nonogram'&&session.task.variant!=='copyPattern'&&!session.task.finished){let previous=session.task;session.task=generateQuestion('logic',previous.level,'nonogram');Object.assign(session.task,{challengeBand:previous.challengeBand||'steady',attempts:0,hint:0,elapsed:0,started:null,finished:false,input:''});saveProgress();}
function migrateOpenExercises(){
  const runs=new Set([session,data.session,data.expedition?.previousSession,...(data.expedition?.entries||[]).map(e=>e.run)]);
  let changed=false;
  for(const run of runs){
    const old=run?.task;if(old?.mode!=='open')continue;
    if(old.finished&&run.results?.at(-1)?.open)run.results.pop();
    run.task=generateQuestion(old.domain||'math',old.level||1,['multi','always'].includes(old.type)?old.type:null);
    Object.assign(run.task,{challengeBand:old.challengeBand||'steady',attempts:0,hint:0,elapsed:0,started:null,finished:false,input:''});
    changed=true;
  }
  if(changed)saveProgress();
}
migrateOpenExercises();
if(session?.task)session.task.started=null;
window.MishaLab={generateQuestion,validQuestion,challengePlan,themeForDay,dailyOrder,dayKey,checkAnswer,adaptDifficulty,applyRoundProgress,roundScore,SEG,attacks,getData:()=>data};

let atlasEntryChosen=false;try{atlasEntryChosen=sessionStorage.getItem('misha-atlas-entry')==='1';}catch(_){}
if(location.hash==='#atlas'){if(atlasEntryChosen)AtlasQuiz.open();else PlaySession.openLaunch({kind:'atlas',key:'atlas'});}else if(location.hash==='#journey')PlaySession.openLaunch({kind:'general',key:'general'});else render();
