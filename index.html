app.innerHTML=`<div class="quest-head"><div><span class="badge">${ico(domains[q.domain].icon)} ${bi(domains[q.domain].title)}</span>${missionTheme?`<span class="badge daily-theme">${ico(missionTheme.icon)} ${bi(missionTheme.name)}</span>`:''}<span class="meta journey-count">${bi(P(`מסע: ${session.runTasks||0} תגליות · רמה ${q.level}`,`Путешествие: ${session.runTasks||0} открытий · уровень ${q.level}`))}</span></div><span class="combo">${ico('flame')} ${data.currentStreak||0} ${bi(P('רצף','серия'))}</span></div><div class="mission-rail">${Array.from({length:5},(_,j)=>`<div class="mission-node ${j<i?'done':j===i?'current':''}"><span>${bi(stages[j])}</span></div>`).join('')}</div><section class="panel task-shell"><div class="eyebrow">${bi(P(`תחנה ${i+1}: ${stages[i].he}`,`Станция ${i+1}: ${stages[i].ru}`))}</div><span class="challenge-band ${q.challengeBand||'steady'}">${bi(challengeNames[q.challengeBand]||challengeNames.steady)}</span><h2>${bi(q.prompt)}</h2>${q.display?`<div class="math" dir="ltr">${esc(q.display)}</div>`:''}${renderVisual(q)}${q.mode==='number'?`<input id="answer" class="answer" inputmode="decimal" autocomplete="off" aria-label="${esc(text(T.answer))}" placeholder="?" value="${esc(q.input)}" ${q.finished?'disabled':''}>`:q.mode==='open'?`<p>${bi(T.self)}</p><textarea id="answer" class="answer" aria-label="${esc(text(T.answer))}" ${q.finished?'disabled':''}>${esc(q.input)}</textarea>`:q.mode==='options'?`<div class="options">${q.options.map((o,j)=>`<button data-option="${j}" class="${q.selected===j?'selected':''}" ${q.finished?'disabled':''}>${bi(o)}</button>`).join('')}</div>`:''}${feedback?`<div role="status" class="feedback ${feedback==='success'?'success':''}">${bi(feedback==='success'?T.success:feedback==='open'?T.self:feedback==='skip'?T.skipped:T[feedback])}${earned?`<div class="xp-pop">${ico('sparkles')} +${earned} XP</div>`:''}${['success','open','skip'].includes(feedback)?`<p>${bi(q.hints[2])}</p>`:''}</div>`:''}${newBadge?`<div class="level-up"><b>${ico(badgeDefs[newBadge].icon)} ${bi(P('תג חדש נפתח!','Открыт новый значок!'))}</b>${bi(badgeDefs[newBadge].name)}</div>`:''}${q.hint?`<div class="hint">${q.hints.slice(0,q.hint).map((h,j)=>`<p><b>${bi(P(`רמז ${j+1}`,`Подсказка ${j+1}`))}</b>${bi(h)}</p>`).join('')}</div>`:''}<div class="actions">${q.finished?btn('next',P('אל התגלית הבאה','К следующему открытию'),'primary'):btn('check',q.mode==='open'?T.open:T.check,'primary')+`<button data-action="hint" ${q.hint===3?'disabled':''}>${bi(T.hint)} (${q.hint}/3)</button>`+btn('skip',T.skip)}</div>${q.finished&&(i===1||i===4)?`<div class="panel"><b>${bi(T.feel)}</b><div class="options">${['easy','right','hard'].map(f=>`<button data-feel="${f}" class="${session.results.at(-1).feeling===f?'selected':''}">${bi(T[f])}</button>`).join('')}</div></div>`:''}</section>${(session.runTasks||0)>0&&(session.runTasks||0)%20===0?`<p class="break-note">${bi(P('כבר עשרים תגליות במסע הזה. אפשר להמשיך, ואפשר גם למתוח ידיים ולנוח לרגע.','Уже двадцать открытий в этом путешествии. Можно продолжить или ненадолго размяться.'))}</p>`:''}`;
}
if(screen==='end'){let rs=session.results,round=currentRound(),score=round?.score??roundScore(rs),researchCount=rs.filter(r=>r.open&&!r.skipped).length,changes=round?.levelChanges||{};app.innerHTML=`<section class="hero"><img src="assets/characters/mishi-success.svg" alt="${esc(text(P('מישי חוגג את השלמת המסע','Миша празднует завершение путешествия')))}" style="float:inline-end;width:min(220px,38vw);margin:0 18px 16px"><div class="eyebrow">${bi(P('מצב רציף · גרסה 2','Непрерывный режим · версия 2'))}</div><h1>${bi(T.end)}</h1><p>${bi(P('הציון ושינוי הרמה מוצגים לרגע. האתגר הבא יתחיל אוטומטית בעוד שלוש שניות.','Результат и изменение уровня показаны на мгновение. Следующее задание начнётся автоматически через три секунды.'))}</p><div class="stat" style="text-align:center;margin:24px 0"><strong style="font-size:54px" dir="ltr">${score}/100</strong>${bi(T.score)}<div class="sub">${bi(T.scoreNote)}</div></div><div class="stats">${[['solved',rs.filter(r=>r.correct).length],['reviewed',researchCount],['skipped',rs.filter(r=>r.skipped).length]].map(([k,v])=>`<div class="stat"><strong>${v}</strong>${bi(T[k])}</div>`).join('')}</div>${researchCount?`<div class="hint">${bi(T.researchInfo)}</div>`:''}<div class="panel"><h2>${bi(P('האתגר עולה אוטומטית','Сложность растёт автоматически'))}</h2><p>${bi(P('המערכת העלתה את הרמה ככל שהביצועים העצמאיים אפשרו. הצלחה מלאה בסבב יכולה להעלות עד שתי רמות.','Система повысила уровень настолько, насколько позволила самостоятельная работа. Идеальный результат может поднять уровень сразу на две ступени.'))}</p>${Object.entries(changes).map(([d,c])=>`<div class="row"><span>${bi(domains[d].title)}</span><b dir="ltr">${c.before} → ${c.after}</b></div>`).join('')}<div class="actions">${btn('next-round',P('להתחיל עכשיו','Начать сейчас'),'primary')}</div></div><div class="actions">${round?.handRaisedAt?`<button disabled>${bi(T.handRaised)}</button>`:btn('raise-hand',T.raiseHand)}${btn('home',T.home)}</div></section>`;scheduleNextRound(round?.track);}
if(screen==='teacher'){renderTeacher(app);renderTeacherExtras(app);renderResetPanel(app);}startHudClock();narrateCurrent();
}
function renderTeacher(app){let h=data.history,closed=h.filter(r=>!r.open),solved=closed.filter(r=>r.correct),waiting=data.rounds.map((r,i)=>({r,i})).filter(x=>x.r.handRaisedAt&&!x.r.handAcknowledgedAt);app.innerHTML=`<h1>${bi(T.teacher)}</h1><p>${bi(T.note)}</p>${waiting.map(({r,i})=>`<div class="feedback success" role="alert"><div class="row"><div><b>${bi(T.finishedAlert)}</b><div class="sub">${esc(new Date(r.handRaisedAt).toLocaleString(data.lang==='ru'?'ru-RU':'he-IL'))} · <span dir="ltr">${r.score??roundScore(r.results)}/100</span></div></div><button data-ack="${i}">${bi(T.acknowledge)}</button></div></div>`).join('')}<div class="stats">${[[data.rounds.length,T.rounds],[closed.length?Math.round(solved.length/closed.length*100)+'%':'—',T.rate],[solved.length?median(solved.map(r=>r.seconds)):'—',T.median]].map(([v,t])=>`<div class="stat"><strong>${v}</strong>${bi(t)}</div>`).join('')}</div><section class="panel"><p>${bi(T.automaticLevels)}</p>${Object.entries(domains).map(([d,v])=>`<div class="row" style="margin-bottom:18px"><span>${bi(v.title)}</span><b>${bi(P(`רמה ${data.levels[d]}`,`Уровень ${data.levels[d]}`))}</b></div>`).join('')}<p>${bi(P(`משימות שבהן נעשה שימוש ברמזים: ${h.filter(r=>r.hints).length} מתוך ${h.length}.`,`Задач с подсказками: ${h.filter(r=>r.hints).length} из ${h.length}.`))}</p><h2>${bi(T.skills)}</h2>${Object.keys(data.mastery).length?Object.entries(data.mastery).map(([k,m])=>{let [d,t]=k.split(':');return `<p>${bi(domains[d].title)} · ${bi(types[t]||P(t,t))} <b dir="ltr">${m.solved}/${m.attempted}</b> ${bi(P(m.attempted>=3&&m.solved/m.attempted>=.8?'שליטה יציבה':'ממשיכים לחקור',m.attempted>=3&&m.solved/m.attempted>=.8?'Устойчивый результат':'Продолжаем исследовать'))}</p>`;}).join(''):`<p class="empty">${bi(T.none)}</p>`}</section><details class="panel"><summary>${bi(T.history)}</summary><div class="tablewrap"><table><thead><tr>${[P('תאריך','Дата'),P('נושא','Тема'),T.level,P('תוצאה','Результат'),T.hints,T.feel].map(p=>`<th>${bi(p)}</th>`).join('')}</tr></thead><tbody>${h.slice().reverse().slice(0,100).map(r=>`<tr><td>${esc(new Date(r.at).toLocaleDateString(data.lang==='ru'?'ru-RU':'he-IL'))}</td><td>${bi(domains[r.domain].title)}${bi(types[r.type]||T.research)}</td><td dir="ltr">${r.level} (${r.before} → ${r.after})</td><td>${bi(r.skipped?T.skipped:r.open?T.reviewed:r.correct?T.solved:P('טרם נפתרה','Пока не решена'))}<br>${bi(P(`${r.seconds} שניות`,`${r.seconds} с`))}</td><td>${r.hints}</td><td>${r.feeling?bi(T[r.feeling]):'—'}</td></tr>`).join('')}</tbody></table></div></details><div class="actions">${btn('export',T.export,'primary')}${btn('reset',T.reset)}</div>`;}
function renderTeacherExtras(app){let panel=app.querySelector('.panel'),scores=data.rounds.slice(-8),challenging=Object.entries(data.mastery).filter(([,m])=>m.attempted>=2&&m.solved/m.attempted<.6),mastered=Object.entries(data.mastery).filter(([,m])=>m.attempted>=3&&m.solved/m.attempted>=.8);if(panel?.querySelector('p'))panel.querySelector('p').innerHTML=bi(P('הרמות נקבעות אוטומטית לפי הצלחה, ניסיונות ורמזים. המורה צופה בהתקדמות אך אינה קובעת את הרמה.','Уровни определяются автоматически по правильным ответам, попыткам и подсказкам. Учитель наблюдает за прогрессом, но не задаёт уровень.'));let label=k=>{let [d,t]=k.split(':');return `${text(domains[d].title)} — ${text(types[t]||P(t,t))}`;};let html=`<section class="panel"><h2>${bi(P('מגמת הסבבים','Динамика занятий'))}</h2>${scores.length?`<div style="display:flex;align-items:end;gap:10px;height:150px;direction:ltr">${scores.map((r,i)=>{let score=r.score??roundScore(r.results);return `<div style="flex:1;text-align:center"><div title="${score}/100" style="height:${Math.max(8,score)}px;background:#6557c8;border-radius:8px 8px 2px 2px"></div><small>${score}</small></div>`;}).join('')}</div>`:`<p class="empty">${bi(T.none)}</p>`}<div class="stats" style="margin-top:20px"><div class="stat"><strong>${mastered.length}</strong>${bi(P('סוגי משימות בשליטה','Освоенные типы задач'))}</div><div class="stat"><strong>${challenging.length}</strong>${bi(P('סוגים שעדיין מאתגרים','Типы, которые ещё трудны'))}</div><div class="stat"><strong>${data.history.filter(r=>r.feeling==='easy').length}</strong>${bi(P('דיווחים: קל מדי','Ответов: слишком легко'))}</div></div>${challenging.length?`<h3>${bi(P('כדאי להמשיך לתרגל','Стоит продолжить тренироваться'))}</h3><ul>${challenging.slice(0,6).map(([k])=>`<li>${esc(label(k))}</li>`).join('')}</ul>`:''}</section>`;app.querySelector('.stats')?.insertAdjacentHTML('afterend',html);}
function renderResetPanel(app){let html=`<section class="panel" style="border-color:#f0c7c7;background:#fffafa"><div class="row"><div><h2 style="margin:0 0 8px">${bi(P('התחלה חדשה','Начать заново'))}</h2><p style="margin:0">${bi(P('איפוס מוחק את הרמות, הציונים, ה־XP, התגים והיסטוריית התרגול במכשיר הזה. השפה והעדפת השעון יישמרו.','Сброс удалит уровни, результаты, XP, значки и историю занятий на этом устройстве. Язык и настройка часов сохранятся.'))}</p></div><button data-action="reset" style="background:#a93f4b;color:#fff">${bi(T.reset)}</button></div></section>`;app.querySelector('h1')?.insertAdjacentHTML('afterend',html);}
function pause(){if(session?.task?.started){session.task.elapsed+=Date.now()-session.task.started;session.task.started=null;saveProgress();}}
function resume(){if(session){session.runStartedAt=session.runStartedAt||Date.parse(session.started)||Date.now();session.runTasks=session.runTasks||session.results.length;if(!session.task.finished)session.task.started=Date.now();}screen='task';feedback=session.task.finished?(session.results.at(-1).skipped?'skip':session.task.mode==='open'?'open':'success'):null;render();}
document.addEventListener('input',e=>{if(e.target.id==='answer'){session.task.input=e.target.value;saveProgress();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'&&session.task.mode!=='open'){e.preventDefault();check();}if((e.key==='Enter'||e.key===' ')&&e.target.dataset.match!=null){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-match]');if(!b||b.disabled)return;let ds=b.dataset;if(ds.lang){data.lang=ds.lang;narratedTarget=null;narratedState='';window.speechSynthesis?.cancel();saveProgress();render();return;}if(ds.track){startRound(ds.track);return;}if(ds.ack!=null){let round=data.rounds[Number(ds.ack)];if(round){round.handAcknowledgedAt=new Date().toISOString();saveProgress();render();}return;}let q=session?.task;if(ds.square!=null&&!q.finished){q.selected=Number(ds.square);saveProgress();render();return;}if(ds.option!=null&&!q.finished){q.selected=Number(ds.option);saveProgress();render();return;}if(ds.cell!=null&&!q.finished){let n=Number(ds.cell);q.selected=q.selected.includes(n)?q.selected.filter(x=>x!==n):[...q.selected,n];saveProgress();render();return;}if(ds.match!=null&&!q.finished){let n=Number(ds.match);if(q.moves)return;if(q.board[n])q.source=q.source===n?null:n;else if(q.source!=null){q.board[q.source]=0;q.board[n]=1;q.moves=1;q.source=null;}saveProgress();render();return;}if(ds.feel){let r=session.results.at(-1);if(!r.feeling&&ds.feel==='easy'&&r.correct&&!r.hints&&r.attempts===1){let m=data.mastery[r.domain+':'+r.type];if(m&&m.streak>=2){data.levels[r.domain]=Math.min(10,data.levels[r.domain]+1);m.streak=0;r.after=data.levels[r.domain];}}r.feeling=ds.feel;saveProgress();render();return;}
switch(ds.action){case'home':pause();screen='home';feedback=null;render();break;case'teacher':pause();screen='teacher';render();break;case'daily':startRound('daily');break;case'resume':resume();break;case'toggle-clock':data.showClock=data.showClock===false;saveProgress();updateHud();break;case'toggle-speech':data.readAloud=!data.readAloud;narratedTarget=null;narratedState='';if(!data.readAloud)window.speechSynthesis.cancel();saveProgress();render();break;case'check':check();break;case'hint':q.hint=Math.min(3,q.hint+1);saveProgress();render();break;case'skip':finishTask(false,true);render();break;case'next':next();break;case'next-round':{let round=currentRound();startRound(round?.track||'daily',true);break;}case'raise-hand':{let round=currentRound();if(round&&!round.handRaisedAt){round.handRaisedAt=new Date().toISOString();saveProgress();render();}break;}case'undo':q.board=[...q.initial];q.moves=0;q.source=null;feedback=null;saveProgress();render();break;case'export':{pause();let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='misha-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}case'reset':if(confirm(text(T.confirm))){let lang=data.lang,showClock=data.showClock,readAloud=data.readAloud;clearTimeout(autoNextTimer);clearInterval(hudTimer);window.speechSynthesis?.cancel();data=fresh();data.lang=lang;data.showClock=showClock;data.readAloud=readAloud;session=null;feedback=null;narratedTarget=null;narratedState='';saveProgress();render();}break;}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();window.speechSynthesis?.cancel();if(session?.runStartedAt)session.runPauseStarted=Date.now();}else if(session){if(session.runPauseStarted){session.runStartedAt+=Date.now()-session.runPauseStarted;session.runPauseStarted=null;saveProgress();}if(screen==='task'&&!session.task.finished)session.task.started=Date.now();}});window.addEventListener('pagehide',()=>{pause();window.speechSynthesis?.cancel();});
if(session?.task)session.task.started=null;
window.MishaLab={generateQuestion,validQuestion,challengePlan,themeForDay,dailyOrder,dayKey,checkAnswer,adaptDifficulty,applyRoundProgress,roundScore,SEG,attacks,getData:()=>data};
render();
</script></body></html>
